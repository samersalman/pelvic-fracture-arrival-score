services:
  - type: web
    name: pelvic-fracture-arrival-score
    env: python
    plan: free
    rootDir: calculator
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
